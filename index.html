    function analyzeSelection(selected, board, lang) {
        const t = T[lang];
        if (!board || selected.length === 0) {
            return { valid: false, reason: t.err_selectAtLeastOne };
        }
        for (const i of selected) {
            if (board[i])
                return { valid: false, reason: t.err_occupied };
        }
        const rows = new Set(selected.map(row));
        const cols = new Set(selected.map(col));
        if (rows.size > 1 && cols.size > 1) {
            return { valid: false, reason: t.err_sameLine };
        }
        if (rows.size === 1) {
            const sorted = [...selected].sort((a, b) => col(a) - col(b));
            for (let k = 1; k < sorted.length; k++) {
                const gap = col(sorted[k]) - col(sorted[k - 1]);
                if (gap !== 1)
                    return { valid: false, reason: t.err_adjacent };
            }
        }
        else {
            const sorted = [...selected].sort((a, b) => row(a) - row(b));
            for (let k = 1; k < sorted.length; k++) {
                const gap = row(sorted[k]) - row(sorted[k - 1]);
                if (gap !== 1)
                    return { valid: false, reason: t.err_adjacent };
            }
        }
        return { valid: true, reason: "" };
    }
    // Game 1: chosen starter. Game 2: the other player. Decider (game 3): chosen starter again.
    function starterFor(gameIndex, initialStarter) {
        const other = initialStarter === 1 ? 2 : 1;
        if (gameIndex === 2)
            return other;
        return initialStarter;
    }
    // ---------------------------------------------------------------------------
    // AI ENGINE
    // This is a "last to move loses" combinatorial game: a move fills one or
    // more currently-empty, adjacent cells in a single row or column. Since
    // legality never depends on *who* owns a filled cell (only whether it's
    // filled), the game is impartial — its outcome from any position depends
    // only on which cells are empty, not on move history. That lets us solve it
    // exactly with memoized recursion over the 16-bit "empty cells" bitmask.
    // ---------------------------------------------------------------------------
    // ---------------------------------------------------------------------------
    // GAME MODES: "classic" = full 4x4. "random" = 1-3 of the 4 center cells are
    // removed (blocked) for the whole match. Blocked cells are stored as BLOCKED
    // in the board, so every "is this cell taken?" check treats them as occupied.
    // ---------------------------------------------------------------------------
    const CENTER_CELLS = [5, 6, 9, 10];
    const BLOCKED = 3;
    function makeHoles(mode) {
        if (mode !== "random")
            return [];
        const count = 1 + Math.floor(Math.random() * 3);
        const pool = [...CENTER_CELLS];
        for (let i = pool.length - 1; i > 0; i--) {
            const k = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[k]] = [pool[k], pool[i]];
        }
        return pool.slice(0, count);
    }
    function emptyBoard(holes) {
        const b = Array(TOTAL).fill(null);
        (holes || []).forEach((i) => {
            b[i] = BLOCKED;
        });
        return b;
    }
    const FULL_MASK = (1 << TOTAL) - 1;
    function movesFromMask(mask) {
        // mask: bits set = OCCUPIED. Returns array of resulting masks after each
        // legal move (each move fills a contiguous run of currently-empty cells
        // within a single row or column).
        const moves = [];
        const addRunMoves = (cells) => {
            // cells: ordered list of board indices for one row or column
            let start = 0;
            while (start < cells.length) {
                if (mask & (1 << cells[start])) {
                    start++;
                    continue;
                }
                let end = start;
                while (end < cells.length && !(mask & (1 << cells[end])))
                    end++;
                // empty run is cells[start..end-1]; every contiguous sub-run is a legal move
                for (let a = start; a < end; a++) {
                    let bits = 0;
                    for (let b = a; b < end; b++) {
                        bits |= 1 << cells[b];
                        moves.push(mask | bits);
                    }
                }
                start = end;
            }
        };
        for (let r = 0; r < N; r++) {
            const cells = [];
            for (let c = 0; c < N; c++)
                cells.push(r * N + c);
            addRunMoves(cells);
        }
        for (let c = 0; c < N; c++) {
            const cells = [];
            for (let r = 0; r < N; r++)
                cells.push(r * N + c);
            addRunMoves(cells);
        }
        return moves;
    }
    function maskToMove(prevMask, newMask) {
        const diff = prevMask ^ newMask;
        const cells = [];
        for (let i = 0; i < TOTAL; i++)
            if (diff & (1 << i))
                cells.push(i);
        return cells;
    }
    const solveMemo = new Map();
    function solve(mask) {
        // Returns true if the player about to move from `mask` can force the
        // OPPONENT to place the last mark (i.e. can force a win).
        if (solveMemo.has(mask))
            return solveMemo.get(mask);
        let winFound = false;
        const nextMasks = movesFromMask(mask);
        for (const nm of nextMasks) {
            if (nm === FULL_MASK)
                continue; // this move loses immediately for the mover
            if (!solve(nm)) {
                winFound = true;
                break;
            }
        }
        solveMemo.set(mask, winFound);
        return winFound;
    }
    function boardToMask(board) {
        let mask = 0;
        for (let i = 0; i < TOTAL; i++)
            if (board[i])
                mask |= 1 << i;
        return mask;
    }
    function bestAIMoves(board) {
        // Returns { winning: [cellArrays...], losing: [cellArrays...] } from the
        // current position — winning = moves that leave the opponent losing.
        const mask = boardToMask(board);
        const nextMasks = movesFromMask(mask);
        const winning = [];
        const losing = [];
        for (const nm of nextMasks) {
            const move = maskToMove(mask, nm);
            if (nm === FULL_MASK || solve(nm)) {
                losing.push(move); // leaves opponent (or self) in/forced-toward a losing spot for the mover
            }
            else {
                winning.push(move);
            }
        }
        return { winning, losing };
    }
    const SPEED_SECONDS = { bullet: 5, blitz: 10, rapid: 30 };
    function chooseAIMove(board, difficulty) {
        const { winning, losing } = bestAIMoves(board);
        const optimalPool = winning.length > 0 ? winning : losing;
        const allMoves = [...winning, ...losing];
        const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const optimalChance = difficulty === "hard" ? 1 : difficulty === "medium" ? 0.7 : 0.2;
        if (Math.random() < optimalChance) {
            return pickRandom(optimalPool);
        }
        return pickRandom(allMoves);
    }

        let s = "";

    function App() {

            borderRadius: 999,
            padding: "6px 16px",
            fontFamily: font,
            fontWeight: 700,
            fontSize: 12,
            cursor: "pointer",
        }),
        eyebrow: {
            textAlign: "center",
            color: COLORS.gold,
            fontWeight: 700,
            letterSpacing: 1,
            fontSize: 13,
            marginBottom: 4,
        },
        title: { textAlign: "center", fontWeight: 800, fontSize: 30, margin: "0 0 18px" },
        card: {
            background: COLORS.card,
            borderRadius: 18,
            padding: 18,
            boxShadow: `inset 0 0 0 1px ${COLORS.goldDim}`,
            marginBottom: 16,
        },
        introText: { color: COLORS.textMuted, fontSize: 14, lineHeight: 1.7, margin: "6px 0" },
        row: { display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" },
        bigBtn: {
            flex: 1,
            minWidth: 130,
            border: "none",
            borderRadius: 12,
            padding: "13px 14px",
            fontFamily: font,
            fontWeight: 800,
            fontSize: 15,
            color: "#fdf6e8",
            cursor: "pointer",
        },
        p1Btn: { background: COLORS.p1 },
        p2Btn: { background: COLORS.p2 },
        neutralBtn: { background: "#6b5638", width: "100%" },
        linkBtn: {
            background: "transparent",
            border: "none",
            color: COLORS.gold,
            fontFamily: font,
            fontWeight: 700,
            fontSize: 13,
            cursor: "pointer",
            padding: "8px 4px",
        },
        nameField: { marginTop: 12 },
        nameLabel: (color) => ({
            display: "block",
            fontSize: 12,
            fontWeight: 700,
            marginBottom: 6,
            color,
        }),
        nameInput: {
            width: "100%",
            background: "#241a13",
            border: `1px solid ${COLORS.goldDim}`,
            borderRadius: 10,
            padding: "10px 12px",
            color: COLORS.cream,
            fontFamily: font,
            fontSize: 14,
            outline: "none",
        },
        smallNote: { color: COLORS.textMuted, fontSize: 12, marginTop: 8, lineHeight: 1.6 },
        errorText: { color: COLORS.danger, fontSize: 13, fontWeight: 700, marginTop: 8 },
        matchBar: {
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            padding: "0 4px",
            marginBottom: 8,
        },
        matchLabel: { color: COLORS.gold, fontWeight: 700, fontSize: 13 },
        matchScoreText: { fontWeight: 800, fontSize: 16 },
        statusBar: { display: "flex", alignItems: "center", gap: 10, padding: "0 4px", marginBottom: 4 },
        turnPill: (player) => ({
            flex: 1,
            textAlign: "center",
            padding: "8px 10px",
            borderRadius: 999,
            fontWeight: 800,
            fontSize: 13,
            background: player === 1 ? COLORS.p1 : player === 2 ? COLORS.p2 : "#6b5638",
            color: "#fdf6e8",
        }),
        timerPill: (t, total) => ({
            width: 40,
            height: 40,
            borderRadius: "50%",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            fontWeight: 800,
            fontSize: 15,
            border: `2px solid ${t <= Math.ceil(total / 3) ? COLORS.danger : COLORS.gold}`,
            color: t <= Math.ceil(total / 3) ? COLORS.danger : COLORS.gold,
        }),
        counter: { color: COLORS.textMuted, fontSize: 12, minWidth: 46, textAlign: "left" },
        grid: {
            display: "grid",
            gridTemplateColumns: `repeat(${N}, 1fr)`,
            gap: 10,
            maxWidth: 380,
            margin: "16px auto",
            padding: 14,
            background: "#1c130c",
            borderRadius: 18,
            boxShadow: `inset 0 0 0 2px ${COLORS.goldDim}`,
        },
        cellStyle: (val, isSelected, isLast, interactive) => ({
            aspectRatio: "1 / 1",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            fontSize: 26,
            fontWeight: 800,
            borderRadius: 10,
            cursor: interactive && !val ? "pointer" : "default",
            userSelect: "none",
            border: val === BLOCKED ? "2px dashed rgba(232,179,74,0.3)" : "none",
            background: val === BLOCKED ? "#120c07" : val === 1 ? COLORS.p1 : val === 2 ? COLORS.p2 : isSelected ? COLORS.gold : COLORS.cream,
            color: val ? "#fdf6e8" : "#3a2c1e",
            boxShadow: isLast
                ? `0 0 0 3px ${COLORS.gold}`
                : isSelected
                    ? `0 0 0 3px rgba(232,179,74,0.6)`
                    : "none",
        }),
        controls: { padding: "0 4px" },
        feedback: (valid, len) => ({
            fontSize: 13,
            fontWeight: 700,
            color: len === 0 ? COLORS.textMuted : valid ? COLORS.ok : COLORS.danger,
            marginBottom: 8,
            minHeight: 18,
        }),
        actionBtn: {
            flex: 1,
            border: "none",
            borderRadius: 12,
            padding: "12px 14px",
            fontFamily: font,
            fontWeight: 800,
            fontSize: 14,
            cursor: "pointer",
        },
        confirmActive: { background: COLORS.ok, color: "#fdf6e8" },
        confirmDisabled: { background: "#4a4032", color: COLORS.textMuted, cursor: "not-allowed" },
        ghostBtn: { background: "transparent", border: `1px solid ${COLORS.goldDim}`, color: COLORS.cream },
        resultTitle: { fontWeight: 800, fontSize: 16, marginBottom: 4 },
        resultSub: { color: COLORS.textMuted, fontSize: 13, marginBottom: 10 },
        matchWinnerBanner: {
            background: COLORS.gold,
            color: "#241a13",
            fontWeight: 800,
            textAlign: "center",
            borderRadius: 12,
            padding: "10px 12px",
            margin: "10px 0",
        },
        scoreBoard: { display: "flex", gap: 10, margin: "10px 0" },
        scoreItem: (color) => ({
            flex: 1,
            background: "#241a13",
            borderRadius: 10,
            padding: "8px 10px",
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            fontSize: 13,
            fontWeight: 700,
            boxShadow: `inset 0 0 0 2px ${color}`,
        }),
        speedRow: { display: "flex", gap: 8, margin: "6px 0 4px" },
        speedBtn: (active) => ({
            flex: 1,
            border: `1px solid ${active ? COLORS.gold : COLORS.goldDim}`,
            background: active ? COLORS.gold : "transparent",
            color: active ? "#241a13" : COLORS.cream,
            borderRadius: 10,
            padding: "8px 6px",
            fontFamily: font,
            fontWeight: 700,
            fontSize: 12,
            cursor: "pointer",
        }),
        roomCodeBox: {
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            gap: 6,
            background: "#241a13",
            borderRadius: 12,
            padding: "14px 12px",
            marginBottom: 10,
        },
        roomCodeText: { fontSize: 30, fontWeight: 800, letterSpacing: 6, color: COLORS.gold },
        copyBtn: {
            marginTop: 6,
            border: "none",
            borderRadius: 999,
            padding: "8px 16px",
            background: COLORS.gold,
            color: "#241a13",
            fontFamily: font,
            fontWeight: 800,
            fontSize: 12,
            cursor: "pointer",
        },
        waitingNote: { textAlign: "center", color: COLORS.textMuted, fontSize: 13, margin: "4px 0 12px" },
    };
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
} // end boot()
if (window.fb) {
    boot(window.fb.db, window.fb.doc, window.fb.getDoc, window.fb.setDoc, window.fb.deleteDoc, window.fb.onSnapshot);
}
else {
    showBootError(window.__fbError || "فشل تحميل Firebase.");
}

    </script>
  </body>
</html>
